name: Offline validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    if: github.repository == '7yedeng/kwMembership'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Download public module dependencies
        run: go mod download
      - name: Run all Go fixture tests
        env:
          GOPROXY: 'off'
          GOTOOLCHAIN: local
        run: go test -count=1 ./...

  python-browser:
    if: github.repository == '7yedeng/kwMembership'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the pinned executor test dependency
        run: python -m pip install --disable-pip-version-check -r python_executor/requirements.txt
      - name: Install the matching official Chromium headless shell
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Check the test runtimes
        run: |
          python --version
          python -m playwright --version
          node --version
      - name: Run offline Python and real browser fixture tests without skips
        env:
          KWMEMBERSHIP_REQUIRE_BROWSER_TESTS: '1'
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover('python_executor/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print('Offline validation requires every test to execute; skipped tests fail CI.', file=sys.stderr)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
